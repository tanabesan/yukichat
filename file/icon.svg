<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b74f7"/>
      <stop offset="100%" stop-color="#4752c4"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 背景（丸角スクエア） -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- チャット吹き出し（本体は楕円、しっぽは別パーツにして継ぎ目を無くす） -->
  <g filter="url(#soft-shadow)">
    <path d="M186 356 L128 420 C122 426 113 421 115 413 L143 335 Z" fill="#ffffff"/>
    <ellipse cx="256" cy="238" rx="166" ry="138" fill="#ffffff"/>
  </g>

  <!-- 雪の結晶（ゆき） -->
  <g stroke="#4752c4" stroke-width="16" stroke-linecap="round">
    <line x1="256" y1="180" x2="256" y2="292"/>
    <line x1="200" y1="236" x2="312" y2="236"/>
    <line x1="216" y1="196" x2="296" y2="276"/>
    <line x1="296" y1="196" x2="216" y2="276"/>
  </g>
  <g fill="#4752c4">
    <circle cx="256" cy="180" r="11"/>
    <circle cx="256" cy="292" r="11"/>
    <circle cx="200" cy="236" r="11"/>
    <circle cx="312" cy="236" r="11"/>
    <circle cx="216" cy="196" r="11"/>
    <circle cx="296" cy="276" r="11"/>
    <circle cx="296" cy="196" r="11"/>
    <circle cx="216" cy="276" r="11"/>
    <circle cx="256" cy="236" r="14"/>
  </g>
</svg>
